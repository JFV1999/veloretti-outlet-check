name: Check Veloretti outlet

on:
  schedule:
    - cron: "0 9,12,17 * * *"
      timezone: "Europe/Amsterdam"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veloretti-outlet-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Restore previous price state
        uses: actions/cache/restore@v4
        with:
          path: state/prices.json
          key: veloretti-prices-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            veloretti-prices-

      - name: Check outlet and prices
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/check_veloretti.py

      - name: Save current price state
        uses: actions/cache/save@v4
        with:
          path: state/prices.json
          key: veloretti-prices-${{ github.run_id }}-${{ github.run_attempt }}
