name: Check Veloretti outlet

on:
  schedule:
    - cron: "0 9,12,17 * * *"
      timezone: "Europe/Amsterdam"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veloretti-outlet-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check outlet and prices
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/check_veloretti.py

      - name: Save price history to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/prices.json
          if git diff --cached --quiet; then
            echo "Price history is unchanged."
          else
            git commit -m "Update Veloretti price history"
            git push
          fi
