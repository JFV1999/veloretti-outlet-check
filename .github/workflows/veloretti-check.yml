name: Check Veloretti outlet

on:
  schedule:
    - cron: "7 9 * * *"
      timezone: "Europe/Amsterdam"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check outlet and notify via ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request

          OUTLET = "https://www.veloretti.com/nl/outlet"
          NEEDLE = "ace two pro black edition"
          topic = os.environ.get("NTFY_TOPIC", "").strip()

          req = urllib.request.Request(
              OUTLET,
              headers={"User-Agent": "Mozilla/5.0 (compatible; VelorettiOutletChecker/1.0)"}
          )
          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  page = response.read().decode("utf-8", errors="replace")
          except Exception as exc:
              print(f"Could not fetch outlet page: {exc}", file=sys.stderr)
              sys.exit(1)

          decoded = html.unescape(page)
          normalized = re.sub(r"\\s+", " ", re.sub(r"<[^>]+>", " ", decoded)).lower()
          if NEEDLE not in normalized:
              # Shopify pages may include product data as JSON in the source. Check decoded source too.
              if NEEDLE not in re.sub(r"\\s+", " ", decoded.lower()):
                  print("Ace Two Pro Black Edition not found.")
                  sys.exit(0)

          links = re.findall(r"""href=["']([^"']+)["']""", decoded, flags=re.IGNORECASE)
          candidate_urls = []
          for href in links:
              url = urllib.parse.urljoin(OUTLET, href.replace("\\/", "/"))
              if "veloretti.com" in urllib.parse.urlparse(url).netloc and url not in candidate_urls:
                  candidate_urls.append(url)

          product_urls = [
              url for url in candidate_urls
              if "ace" in url.lower() and ("two" in url.lower() or "pro" in url.lower())
          ]
          product_url = product_urls[0] if product_urls else OUTLET

          if not topic:
              print("Product found, but NTFY_TOPIC secret is not configured.", file=sys.stderr)
              sys.exit(1)

          message = f"Ace Two Pro Black Edition is listed in the Veloretti Outlet: {product_url}"
          request = urllib.request.Request(
              "https://ntfy.sh/" + urllib.parse.quote(topic, safe=""),
              data=message.encode("utf-8"),
              headers={
                  "Title": "Veloretti outlet: fiets gevonden",
                  "Priority": "high",
                  "Tags": "bike",
                  "Content-Type": "text/plain; charset=utf-8",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print(f"ntfy notification sent (HTTP {response.status}).")
          except Exception as exc:
              print(f"Could not send ntfy notification: {exc}", file=sys.stderr)
              sys.exit(1)
          PY