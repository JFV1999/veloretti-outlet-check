name: Check Veloretti outlet

on:
  schedule:
    - cron: "0 9,12,17 * * *"
      timezone: "Europe/Amsterdam"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check outlet for Ace Two Pro or Lite and notify via ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python - <<'PY'
          import html
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request

          OUTLET = "https://www.veloretti.com/nl/outlet"
          PRODUCT_RE = re.compile(r"ace\\s+two\\s+(?:pro|lite)", re.IGNORECASE)
          topic_input = os.environ.get("NTFY_TOPIC", "").strip()

          req = urllib.request.Request(
              OUTLET,
              headers={"User-Agent": "Mozilla/5.0 (compatible; VelorettiOutletChecker/1.0)"}
          )
          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  page = response.read().decode("utf-8", errors="replace")
          except Exception as exc:
              print(f"Could not fetch outlet page: {exc}", file=sys.stderr)
              sys.exit(1)

          decoded = html.unescape(page).replace("\\/", "/")
          links = re.findall(r"""<a\\b[^>]*href=["']([^"']+)["'][^>]*>(.*?)</a>""", decoded, flags=re.IGNORECASE | re.DOTALL)
          found = []
          for href, anchor_html in links:
              title = re.sub(r"<[^>]+>", " ", anchor_html)
              title = re.sub(r"\\s+", " ", html.unescape(title)).strip()
              if PRODUCT_RE.search(title):
                  url = urllib.parse.urljoin(OUTLET, href)
                  if url not in [item["url"] for item in found]:
                      found.append({"title": title, "url": url})

          if not found:
              print("Ace Two Pro or Ace Two Lite not found in outlet.")
              sys.exit(0)

          if not topic_input:
              print("Product found, but NTFY_TOPIC secret is not configured.", file=sys.stderr)
              sys.exit(1)

          parsed_topic = urllib.parse.urlparse(
              topic_input if "://" in topic_input else "https://ntfy.sh/" + topic_input
          )
          if parsed_topic.scheme != "https" or not parsed_topic.netloc or not parsed_topic.path.strip("/"):
              print("NTFY_TOPIC must be an https ntfy topic URL or topic name.", file=sys.stderr)
              sys.exit(1)
          ntfy_url = f"https://{parsed_topic.netloc}/{parsed_topic.path.strip('/')}"

          listing_lines = "\\n".join(f"{item['title']}: {item['url']}" for item in found)
          message = "Veloretti outlet heeft een Ace Two Pro of Ace Two Lite gevonden:\\n" + listing_lines
          request = urllib.request.Request(
              ntfy_url,
              data=message.encode("utf-8"),
              headers={
                  "Title": "Veloretti outlet: Ace Two gevonden",
                  "Priority": "high",
                  "Tags": "bike",
                  "Content-Type": "text/plain; charset=utf-8",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print(f"ntfy notification sent (HTTP {response.status}).")
          except Exception as exc:
              print(f"Could not send ntfy notification: {exc}", file=sys.stderr)
              sys.exit(1)
          PY